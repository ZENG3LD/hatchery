[package]
name = "hatchery-hq-web"
version = "0.2.19"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Web HQ for hatchery: a small loopback server that gives a browser the operator view (nodes, terminals, mail, tasks, browser frames) while keeping every token on the server side"

[[bin]]
name = "hatchery-hq-web"
path = "src/main.rs"

[lib]
name = "hatchery_hq_web"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hatchery-session-events = { path = "../hatchery-session-events", version = "0.2.19" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
gate4agent-node-protocol = { version = "0.5.4" }
gate4agent-types = { version = "0.5.2" }
hatchery-c2-client = { path = "../hatchery-c2-client", version = "0.2.19" }
hatchery-core = { path = "../hatchery-core", version = "0.2.19" }
hatchery-bidi-client = { path = "../hatchery-bidi-client", version = "0.2.19" }
sha2 = "0.10"
tokio-tungstenite = "0.26"

[dev-dependencies]
tempfile = "3"
