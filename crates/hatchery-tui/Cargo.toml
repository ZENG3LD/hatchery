[package]
name = "hatchery-tui"
version = "0.2.14"
edition = "2021"
license = "MIT"
description = "hq-edge terminal client for hatchery: a thin wrapper over the hq-core/hq-web API (`hatchery-tui hq`) plus the legacy operator TUI"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"

[dependencies]
crossterm = "0.28"
# Pet Bastion arcade overlay (the status bar's own "pet" modal): the sim
# rules crate, its snapshot-to-Surface render adapter, and the engine's
# `Runner`/`ArcadeShell`/glyph-tier backend that drives and paints it. See
# `src/pet_arcade.rs`'s own module doc comment for the full integration.
# Paths are in-tree hatchery-arcade (NOT a gate4agent sibling). Package
# ids are hatchery-arcade-* (renamed from former gate4agent-arcade-*).
hatchery-arcade-engine = { version = "0.1.4", path = "../hatchery-arcade/engine", default-features = false, features = ["render"], optional = true }
hatchery-arcade-pet-bastion = { version = "0.1.4", path = "../hatchery-arcade/games/pet-bastion", optional = true }
hatchery-arcade-pet-bastion-render = { version = "0.1.4", path = "../hatchery-arcade/games/pet-bastion-render", optional = true }
gate4agent-build-stamp = { version = "0.5.2" }
hatchery-c2-client = { version = "0.2.14" }
hatchery-core = { version = "0.2.14" }
hatchery-harness-client = { version = "0.2.14" }
hatchery-harness-protocol = { version = "0.2.14" }
gate4agent-node-protocol = { version = "0.5.2" }
# `local_hmac_sha256`/`proofs_match`: the same constant-time credential-
# digest primitives `hatchery-harness-service`'s own operator-credential
# authority uses (`HarnessOperatorCredentialAuthority`) -- `control_plane`
# follows that exact precedent instead of hand-rolling a second comparison
# scheme. In-tree sibling crate, no new external dependency.
gate4agent-node-wire = { version = "0.5.2" }
hatchery-observation-api = { version = "0.2.14" }
hatchery-observation-engine = { version = "0.2.14" }
hatchery-observation-protocol = { version = "0.2.14" }
hatchery-observation-service = { version = "0.2.14" }
gate4agent-types = { version = "0.5.2" }
icy_sixel = "0.6"
# `control_plane`'s wire frame: line-delimited JSON, the same idiom
# `hatchery-harness-api`/`hatchery-harness-client` already use for the
# harness operator wire (see that crate's own `Cargo.toml` for the matching
# version pins this mirrors).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uzor-text = "1.5.1"
uzor-tui = { version = "1.5.1", features = ["ascii"] }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# The full local TUI (legacy operator UI with the Pet Bastion arcade overlay). On by default in
# the local-HQ line; `--no-default-features` builds only the hq-edge wrapper. Built on the
# user's machine, never deployed to a server.
default = ["arcade"]
arcade = ["dep:hatchery-arcade-engine", "dep:hatchery-arcade-pet-bastion", "dep:hatchery-arcade-pet-bastion-render"]

[lib]
name = "hatchery_tui"
path = "src/lib.rs"

[[bin]]
name = "hatchery-tui"
path = "src/main.rs"


