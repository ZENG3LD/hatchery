[package]
name = "hatchery-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal client for hatchery: both hatchery-tui and hatchery-tui-light speak only the harness operator wire -- light hosts hatchery-harness-light in-process over c2 instead of a durable task kernel"
publish = false

[dependencies]
crossterm = "0.28"
# Pet Bastion arcade overlay (the status bar's own "pet" modal): the sim
# rules crate, its snapshot-to-Surface render adapter, and the engine's
# `Runner`/`ArcadeShell`/glyph-tier backend that drives and paints it. See
# `src/pet_arcade.rs`'s own module doc comment for the full integration.
# Paths are in-tree hatchery-arcade (NOT a gate4agent sibling). Package
# ids are hatchery-arcade-* (renamed from former gate4agent-arcade-*).
hatchery-arcade-engine = { path = "../hatchery-arcade/engine", default-features = false, features = ["render"] }
hatchery-arcade-pet-bastion = { path = "../hatchery-arcade/games/pet-bastion" }
hatchery-arcade-pet-bastion-render = { path = "../hatchery-arcade/games/pet-bastion-render" }
gate4agent-build-stamp = { path = "../../../gate4agent/crates/gate4agent-build-stamp" }
gate4agent-c2-client = { path = "../../../gate4agent/crates/gate4agent-c2-client" }
gate4agent-c2-protocol = { path = "../../../gate4agent/crates/gate4agent-c2-protocol" }
hatchery-harness-client = { path = "../hatchery-harness-client" }
hatchery-harness-light = { path = "../hatchery-harness-light" }
hatchery-harness-protocol = { path = "../hatchery-harness-protocol" }
gate4agent-node-protocol = { path = "../../../gate4agent/crates/gate4agent-node-protocol" }
# `local_hmac_sha256`/`proofs_match`: the same constant-time credential-
# digest primitives `gate4agent-harness-service`'s own operator-credential
# authority uses (`HarnessOperatorCredentialAuthority`) -- `control_plane`
# follows that exact precedent instead of hand-rolling a second comparison
# scheme. In-tree sibling crate, no new external dependency.
gate4agent-node-wire = { path = "../../../gate4agent/crates/gate4agent-node-wire" }
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-engine = { path = "../hatchery-observation-engine" }
hatchery-observation-protocol = { path = "../hatchery-observation-protocol" }
hatchery-observation-service = { path = "../hatchery-observation-service" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
icy_sixel = "0.6"
# `control_plane`'s wire frame: line-delimited JSON, the same idiom
# `gate4agent-harness-api`/`gate4agent-harness-client` already use for the
# harness operator wire (see that crate's own `Cargo.toml` for the matching
# version pins this mirrors).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uzor-text = "1.5.1"
uzor-tui = { version = "1.5.1", features = ["ascii"] }
vt100 = "0.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[lib]
name = "hatchery_tui"
path = "src/lib.rs"

[[bin]]
name = "hatchery-tui"
path = "src/main.rs"

[[bin]]
name = "hatchery-tui-light"
path = "src/bin/hatchery-tui-light.rs"

