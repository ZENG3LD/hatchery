[package]
name = "hatchery-observation-engine"
version = "0.2.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Bounded in-memory reducer projecting gate4agent observation ingress into session state"

[lib]
name = "hatchery_observation_engine"

[dependencies]
gate4agent-node-protocol = { version = "0.5.6" }
gate4agent-types = { version = "0.5.6" }
hatchery-observation-api = { version = "0.2.22", path = "../hatchery-observation-api" }
hatchery-observation-protocol = { version = "0.2.22", path = "../hatchery-observation-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
