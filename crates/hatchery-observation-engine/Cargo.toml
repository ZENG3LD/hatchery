[package]
name = "hatchery-observation-engine"
version = "0.2.37"
edition = "2021"
license = "MIT"
description = "Bounded in-memory reducer projecting gate4agent observation ingress into session state"
publish = false

[lib]
name = "hatchery_observation_engine"

[dependencies]
gate4agent-node-protocol = { version = "0.4.5" }
gate4agent-types = { version = "0.4.5" }
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-protocol = { path = "../hatchery-observation-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
