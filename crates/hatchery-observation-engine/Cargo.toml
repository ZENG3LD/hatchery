[package]
name = "hatchery-observation-engine"
version = "0.2.37"
edition = "2021"
description = "Bounded in-memory reducer projecting gate4agent observation ingress into session state"
publish = false

[lib]
name = "hatchery_observation_engine"

[dependencies]
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-protocol = { path = "../hatchery-observation-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
hatchery-c2 = { path = "../hatchery-c2" }
hatchery-c2-client = { path = "../hatchery-c2-client" }
hatchery-c2-protocol = { path = "../hatchery-c2-protocol" }
hatchery-node = { path = "../hatchery-node", features = ["fixture"] }
hatchery-node-protocol = { path = "../hatchery-node-protocol" }
hatchery-node-wire = { path = "../hatchery-node-wire" }
gate4agent-testkit = { path = "../../../gate4agent/crates/gate4agent-testkit" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
