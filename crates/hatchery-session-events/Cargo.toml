[package]
name = "hatchery-session-events"
version = "0.2.19"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Session event layer: per-provider live PTY parsers (pluggable trait) that turn the terminal byte stream into typed events, plus an ACP adapter behind the same event type"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vt100 = "0.16"

[dev-dependencies]
base64 = "0.22"
