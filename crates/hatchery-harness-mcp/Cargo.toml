[package]
name = "hatchery-harness-mcp"
version = "0.2.22"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "MCP stdio adapter exposing the grant-filtered hatchery harness read API to MCP clients"

[lib]
name = "hatchery_harness_mcp"

[[bin]]
# Wave C (2026-10-02): shipping bin renamed gate4agent-harness-mcp → hatchery-harness-mcp.
# Env GATE4AGENT_HARNESS_* and DOMAIN/audience strings remain wave D/E (owner-gated).
name = "hatchery-harness-mcp"
path = "src/main.rs"

[[bin]]
name = "acp_fixture_agent"
path = "src/bin/acp_fixture_agent.rs"

[dependencies]
hatchery-harness-client = { version = "0.2.22", path = "../hatchery-harness-client" }
gate4agent-node-protocol = { version = "0.5.6" }
gate4agent-node-wire = { version = "0.5.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
hatchery-c2 = { version = "0.2.22", path = "../hatchery-c2" }
hatchery-c2-client = { version = "0.2.22", path = "../hatchery-c2-client" }
hatchery-harness-engine = { version = "0.2.22", path = "../hatchery-harness-engine" }
hatchery-harness-protocol = { version = "0.2.22", path = "../hatchery-harness-protocol" }
hatchery-harness-service = { version = "0.2.22", path = "../hatchery-harness-service" }
hatchery-node = { version = "0.2.22", path = "../hatchery-node", features = ["fixture"] }
hatchery-observation-service = { version = "0.2.22", path = "../hatchery-observation-service" }
gate4agent-testkit = { version = "0.5.6" }
gate4agent-types = { version = "0.5.6" }
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
