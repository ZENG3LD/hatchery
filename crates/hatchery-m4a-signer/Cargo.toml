[package]
name = "hatchery-m4a-signer"
version = "0.2.14"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "hq-core m4a signer: per-session keys that never leave the signer, sealed by a human key, Biscuit capabilities with attenuation for child sessions"
license = "MIT"

[dev-dependencies]
biscuit-auth = "6"

[dependencies]
biscuit-auth = "6"
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
