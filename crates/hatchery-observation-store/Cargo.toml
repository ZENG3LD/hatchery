[package]
name = "hatchery-observation-store"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "SQLite durability for validated, monitoring-only gate4agent observation operations"

[lib]
name = "hatchery_observation_store"

[dependencies]
hatchery-observation-api = { version = "0.1.0", path = "../hatchery-observation-api" }
hatchery-observation-engine = { version = "0.1.0", path = "../hatchery-observation-engine" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
