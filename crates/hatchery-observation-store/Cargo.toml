[package]
name = "hatchery-observation-store"
version = "0.2.37"
edition = "2021"
license = "MIT"
description = "SQLite durability for validated, monitoring-only gate4agent observation operations"
publish = false

[lib]
name = "hatchery_observation_store"

[dependencies]
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-engine = { path = "../hatchery-observation-engine" }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
