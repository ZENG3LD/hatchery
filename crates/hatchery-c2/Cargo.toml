[package]
name = "hatchery-c2"
version = "0.2.1"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Relay daemon that aggregates node state/events and routes commands down to attached nodes"
license = "MIT"

[lib]
name = "hatchery_c2"

[[bin]]
name = "hatchery-c2"
path = "src/main.rs"

[dependencies]
hatchery-c2-protocol = { path = "../hatchery-c2-protocol", version = "0.2.0" }
gate4agent-node-protocol = { version = "0.5.0" }
gate4agent-node-wire = { version = "0.5.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gate4agent-types = { version = "0.5.0" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
