[package]
name = "hatchery-c2"
version = "0.2.37"
edition = "2021"
description = "Relay daemon that aggregates gate4agent node state/events and routes commands down to attached nodes"
publish = false

[lib]
name = "hatchery_c2"

[[bin]]
name = "gate4agent-c2"
path = "src/main.rs"

[dependencies]
hatchery-c2-protocol = { path = "../hatchery-c2-protocol" }
hatchery-node-protocol = { path = "../hatchery-node-protocol" }
hatchery-node-wire = { path = "../hatchery-node-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
hatchery-c2-client = { path = "../hatchery-c2-client" }
gate4agent-catalog = { path = "../../../gate4agent/crates/gate4agent-catalog" }
hatchery-node = { path = "../hatchery-node", features = ["fixture"] }
gate4agent-runtime-native = { path = "../../../gate4agent/crates/gate4agent-runtime-native" }
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-engine = { path = "../hatchery-observation-engine" }
hatchery-observation-service = { path = "../hatchery-observation-service" }
gate4agent-testkit = { path = "../../../gate4agent/crates/gate4agent-testkit" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
vt100 = "0.16"
