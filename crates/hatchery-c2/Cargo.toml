[package]
name = "hatchery-c2"
version = "0.2.4"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Edge restreamer: opaque multiplex uplink and core drain (A2). No operator control socket."
license = "MIT"

[lib]
name = "hatchery_c2"

[[bin]]
name = "hatchery-c2"
path = "src/main.rs"

[dependencies]
hatchery-c2-protocol = { path = "../hatchery-c2-protocol", version = "0.2.4", features = ["nested-crypto"] }
gate4agent-node-protocol = { version = "0.5.2" }
gate4agent-node-wire = { version = "0.5.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
tracing = "0.1"
hatchery-enroll = { path = "../hatchery-enroll", version = "0.2.4" }
hatchery-build = { path = "../hatchery-build", version = "0.2.4" }
sha2 = "0.10"
getrandom = "0.2"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
chacha20poly1305 = "0.10"
snow = "0.10"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
gate4agent-types = { version = "0.5.2" }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
