[package]
name = "hatchery-enroll"
version = "0.2.9"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Node enrollment wire and key handling shared by hatchery-c2 and hatchery-node: signed requests, node-held keys, signed call-home"
license = "MIT"

[lib]
name = "hatchery_enroll"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
sha2 = "0.10"
getrandom = "0.2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
