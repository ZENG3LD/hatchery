[package]
name = "hatchery-harness-service"
version = "0.2.30"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Single-writer SQLite authority and operator host for the hatchery harness kernel (bin hatchery-harness)"

[lib]
name = "hatchery_harness_service"

[dependencies]
hatchery-c2-client = { version = "0.2.30", path = "../hatchery-c2-client" }
hatchery-core = { path = "../hatchery-core", version = "0.2.30" }
gate4agent-catalog = { version = "0.5.7" }
hatchery-harness-api = { version = "0.2.30", path = "../hatchery-harness-api" }
hatchery-harness-engine = { version = "0.2.30", path = "../hatchery-harness-engine" }
hatchery-harness-delivery = { version = "0.2.30", path = "../hatchery-harness-delivery" }
hatchery-harness-protocol = { version = "0.2.30", path = "../hatchery-harness-protocol" }
gate4agent-node-protocol = { version = "0.5.7" }
gate4agent-node-wire = { version = "0.5.7" }
hatchery-observation-api = { version = "0.2.30", path = "../hatchery-observation-api" }
hatchery-observation-engine = { version = "0.2.30", path = "../hatchery-observation-engine" }
hatchery-observation-protocol = { version = "0.2.30", path = "../hatchery-observation-protocol" }
hatchery-observation-service = { version = "0.2.30", path = "../hatchery-observation-service" }
# HQ messenger surface: the harness consumes mail4agent as a client dependency.
mail4agent-client = { version = "0.4.14" }
mail4agent-api = { version = "0.4.14" }
gate4agent-types = { version = "0.5.7" }
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ring = "=0.17.14"

[dev-dependencies]
hatchery-c2 = { version = "0.2.30", path = "../hatchery-c2" }
hatchery-harness-client = { version = "0.2.30", path = "../hatchery-harness-client" }
hatchery-node = { version = "0.2.30", path = "../hatchery-node", features = ["fixture"] }
ring = "=0.17.14"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
