[package]
name = "hatchery-harness-protocol"
version = "0.2.16"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Bounded, privacy-minimized domain contract (tasks, runs, deliveries) for the hatchery harness kernel"

[lib]
name = "hatchery_harness_protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
