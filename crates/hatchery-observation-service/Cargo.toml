[package]
name = "hatchery-observation-service"
version = "0.2.37"
edition = "2021"
description = "Single-writer durable authority combining the gate4agent observation engine and SQLite store"
publish = false

[lib]
name = "hatchery_observation_service"

[dependencies]
hatchery-observation-api = { path = "../hatchery-observation-api" }
hatchery-observation-engine = { path = "../hatchery-observation-engine" }
hatchery-observation-store = { path = "../hatchery-observation-store" }
thiserror = "2"

[dev-dependencies]
gate4agent-node-protocol = { path = "../../../gate4agent/crates/gate4agent-node-protocol" }
hatchery-observation-protocol = { path = "../hatchery-observation-protocol" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
rusqlite = { version = "0.31", features = ["bundled"] }
