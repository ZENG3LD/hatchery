[package]
name = "hatchery-core"
version = "0.2.24"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Shared hatchery types and utilities for node, edge and core: wire contract, multiplex envelopes, nested restream crypto and keys, replay buffer, node journal"

[lib]
name = "hatchery_core"

[dependencies]
gate4agent-build-stamp = { version = "0.5.6" }
gate4agent-node-protocol = { version = "0.5.6" }
gate4agent-types = { version = "0.5.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
snow = { version = "0.10", optional = true }

[features]
default = ["nested-crypto"]
# Nested restream crypto (outer C2 layer + inner Noise_NK node<->HQ).
nested-crypto = ["dep:sha2", "dep:getrandom", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:snow"]

[dev-dependencies]
serde_json = "1"
base64 = "0.22"
tempfile = "3"
