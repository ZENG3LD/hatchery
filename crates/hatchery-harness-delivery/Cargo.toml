[package]
name = "hatchery-harness-delivery"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Pure, reviewed-source compiler for staged hatchery harness delivery bundles (skills, plugins, MCP config, files)"

[lib]
name = "hatchery_harness_delivery"

[dependencies]
gate4agent-node-protocol = { version = "0.4.8" }
ring = "=0.17.14"
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
] }
