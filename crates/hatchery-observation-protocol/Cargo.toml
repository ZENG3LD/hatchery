[package]
name = "hatchery-observation-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Dependency-light, versioned observation wire contract for gate4agent provider-session monitoring"

[lib]
name = "hatchery_observation_protocol"

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
