[package]
name = "hatchery-observation-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Read-only monitoring domain contract built from bounded gate4agent observation facts"

[lib]
name = "hatchery_observation_api"

[dependencies]
gate4agent-node-protocol = { version = "0.4.8" }
hatchery-observation-protocol = { version = "0.1.0", path = "../hatchery-observation-protocol" }
gate4agent-types = { version = "0.4.8" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
