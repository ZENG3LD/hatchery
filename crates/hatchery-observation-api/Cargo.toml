[package]
name = "hatchery-observation-api"
version = "0.2.16"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Read-only monitoring domain contract built from bounded gate4agent observation facts"

[lib]
name = "hatchery_observation_api"

[dependencies]
gate4agent-node-protocol = { version = "0.5.4" }
hatchery-observation-protocol = { version = "0.2.16", path = "../hatchery-observation-protocol" }
gate4agent-types = { version = "0.5.2" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
