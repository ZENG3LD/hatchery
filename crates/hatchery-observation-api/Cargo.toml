[package]
name = "hatchery-observation-api"
version = "0.2.37"
edition = "2021"
license = "MIT"
description = "Read-only monitoring domain contract built from bounded gate4agent observation facts"
publish = false

[lib]
name = "hatchery_observation_api"

[dependencies]
gate4agent-node-protocol = { path = "../../../gate4agent/crates/gate4agent-node-protocol" }
hatchery-observation-protocol = { path = "../hatchery-observation-protocol" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
