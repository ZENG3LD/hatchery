[package]
name = "hatchery-harness-api"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Read and operator wire contract for the hatchery harness localhost hosts: grant-filtered reads plus the operator credential/action/session-verb set"

[lib]
name = "hatchery_harness_api"

[dependencies]
gate4agent-build-stamp = { version = "0.4.8" }
hatchery-harness-protocol = { version = "0.1.0", path = "../hatchery-harness-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
