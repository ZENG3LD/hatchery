[package]
name = "hatchery-harness-api"
version = "0.2.37"
edition = "2021"
license = "MIT"
description = "Read and operator wire contract for the hatchery harness localhost hosts: grant-filtered reads plus the operator credential/action/session-verb set"
publish = false

[lib]
name = "hatchery_harness_api"

[dependencies]
gate4agent-build-stamp = { version = "0.4.7" }
hatchery-harness-protocol = { path = "../hatchery-harness-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
