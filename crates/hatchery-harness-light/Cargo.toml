[package]
name = "hatchery-harness-light"
version = "0.4.0"
edition = "2021"
description = "Stateless in-process light harness: serves the same operator wire as gate4agent-harness-service, backed directly by C2 instead of the SWC task kernel"
license = "MIT"
publish = false

[lib]
name = "hatchery_harness_light"

[dependencies]
hatchery-c2-client = { path = "../hatchery-c2-client" }
hatchery-c2-protocol = { path = "../hatchery-c2-protocol" }
hatchery-harness-api = { path = "../hatchery-harness-api" }
hatchery-harness-service = { path = "../hatchery-harness-service" }
hatchery-node-protocol = { path = "../hatchery-node-protocol" }
hatchery-node-wire = { path = "../hatchery-node-wire" }
hatchery-observation-api = { path = "../hatchery-observation-api" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
hatchery-c2 = { path = "../hatchery-c2" }
hatchery-harness-client = { path = "../hatchery-harness-client" }
hatchery-node = { path = "../hatchery-node", features = ["fixture"] }
tokio = { version = "1", features = ["full", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
