[package]
name = "hatchery-harness-light"
version = "0.4.0"
edition = "2021"
description = "Stateless in-process light harness: serves the same operator wire as hatchery-harness-service, backed directly by C2 instead of the SWC task kernel"
license = "MIT"
publish = false

[lib]
name = "hatchery_harness_light"

[dependencies]
gate4agent-c2-client = { version = "0.4.7" }
gate4agent-c2-protocol = { version = "0.4.7" }
hatchery-harness-api = { path = "../hatchery-harness-api" }
hatchery-harness-service = { path = "../hatchery-harness-service" }
gate4agent-node-protocol = { version = "0.4.7" }
gate4agent-node-wire = { version = "0.4.7" }
hatchery-observation-api = { path = "../hatchery-observation-api" }
gate4agent-types = { version = "0.4.7" }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
gate4agent-c2 = { version = "0.4.7" }
hatchery-harness-client = { path = "../hatchery-harness-client" }
gate4agent-node = { version = "0.4.7", features = ["fixture"] }
tokio = { version = "1", features = ["full", "test-util"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
