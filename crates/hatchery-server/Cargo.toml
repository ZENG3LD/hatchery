[package]
name = "hatchery-server"
version = "0.2.5"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Host for hatchery subservices (harness, m4a, memory): one supervisor process, loopback control and health"

[lib]
name = "hatchery_server"

[[bin]]
name = "hatchery-server"
path = "src/main.rs"

# The harness and memory run as supervised processes; only the m4a library is
# embedded. (All crates now share one native sqlite, rusqlite 0.36.)

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
m4a-agent = { version = "0.4.10", optional = true }
mail4agent-core = { version = "0.4.10", optional = true }
mail4agent-api = { version = "0.4.10", optional = true }
mail4agent-store-sqlite = { version = "0.4.10", optional = true }
rusqlite = { version = "0.36", features = ["bundled"], optional = true }
hatchery-enroll = { path = "../hatchery-enroll", version = "0.2.5" }
hatchery-core = { path = "../hatchery-core", version = "0.2.5" }
hatchery-c2-client = { path = "../hatchery-c2-client", version = "0.2.5" }
gate4agent-node-protocol = { version = "0.5.2" }
gate4agent-node-wire = { version = "0.5.2" }
gate4agent-types = { version = "0.5.2" }

[features]
# Full kit by default: there is no light mode.
default = ["kit"]
kit = ["harness", "m4a", "memory"]
# harness + observation (bin hatchery-harness) as a supervised process.
harness = []
# m4a: key vault of the node-side messenger (m4a-agent 0.4); master key from env.
m4a = ["dep:m4a-agent", "dep:mail4agent-core", "dep:mail4agent-api", "dep:mail4agent-store-sqlite", "dep:rusqlite"]
# memory4agent-server (crates.io memory4agent 0.3) as an on-demand loopback process.
memory = []

[dev-dependencies]
tempfile = "3"
async-trait = "0.1"
hatchery-c2 = { path = "../hatchery-c2", version = "0.2.5" }
