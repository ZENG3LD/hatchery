[package]
name = "hatchery-c2-client"
version = "0.2.37"
edition = "2021"
description = "Typed client library and CLI (gate4agent-c2ctl) for the gate4agent C2 control and observer APIs"
publish = false

[lib]
name = "hatchery_c2_client"

[dependencies]
hatchery-c2-protocol = { path = "../hatchery-c2-protocol" }
hatchery-node-protocol = { path = "../hatchery-node-protocol" }
hatchery-node-wire = { path = "../hatchery-node-wire" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
