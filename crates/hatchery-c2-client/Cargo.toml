[package]
name = "hatchery-c2-client"
version = "0.2.23"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Typed client library and CLI (hatchery-c2ctl) for the C2 control and observer APIs"
license = "MIT"

[lib]
name = "hatchery_c2_client"

[[bin]]
name = "hatchery-c2ctl"
path = "src/bin/hatchery-c2ctl.rs"

[dependencies]
hatchery-core = { path = "../hatchery-core", version = "0.2.23" }
gate4agent-node-protocol = { version = "0.5.6" }
gate4agent-node-wire = { version = "0.5.6" }
gate4agent-types = { version = "0.5.6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "test-util", "time"] }
