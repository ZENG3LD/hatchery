[package]
name = "hatchery-harness-engine"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../README.md"
description = "Pure, prepare-then-accept state machine for the hatchery harness task/run/delivery kernel"

[lib]
name = "hatchery_harness_engine"

[dependencies]
hatchery-harness-protocol = { version = "0.1.0", path = "../hatchery-harness-protocol" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
