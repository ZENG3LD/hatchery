[package]
name = "hatchery-harness-client"
version = "0.2.37"
edition = "2021"
description = "Typed localhost client and CLI (gate4agent-harnessctl) for the hatchery harness read and operator hosts"
publish = false

[lib]
name = "hatchery_harness_client"

[dependencies]
hatchery-harness-api = { path = "../hatchery-harness-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
