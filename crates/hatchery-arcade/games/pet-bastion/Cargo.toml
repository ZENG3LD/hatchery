[package]
name = "hatchery-arcade-pet-bastion"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../../../README.md"
description = "Pet Bastion: Night Garden -- a deterministic tower-defense run."

[dependencies]
# Sim core only -- `default-features = false` is a structural guard, not a
# behavioural change (the engine's own `default = []` already carries no
# render dep), so a future default feature on the engine can never drag
# uzor/rendering types into this crate's build by accident.
hatchery-arcade-engine = { version = "0.1.0", path = "../../engine", default-features = false }
