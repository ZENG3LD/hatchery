[package]
name = "hatchery-arcade-pet-bastion-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/ZENG3LD/hatchery"
readme = "../../../../README.md"
description = "Pet Bastion snapshot -> engine Surface adapter and tile catalog mapping. See src/lib.rs for why this lives in its own crate rather than inside either pet-bastion or the engine."

[dependencies]
# The render feature is the whole reason this crate exists -- it is the
# ONE consumer allowed to sit on both sides of the terminal/no-terminal
# split (see the engine's own `render/mod.rs` doc comment and pet-bastion's
# own `lib.rs` "Forbidden" doc line).
hatchery-arcade-engine = { version = "0.1.0", path = "../../engine", default-features = false, features = ["render"] }
hatchery-arcade-pet-bastion = { version = "0.1.0", path = "../pet-bastion", default-features = false }
