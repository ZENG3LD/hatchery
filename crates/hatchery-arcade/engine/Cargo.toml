[package]
name = "gate4agent-arcade-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Deterministic mini-game engine and multi-tier terminal renderer."

[features]
default = []
# Pulls the terminal backends in. The sweep package never enables this, so its
# dependency graph never resolves uzor/icy_sixel/urx at all.
render = ["dep:uzor-tui", "dep:uzor-text", "dep:icy_sixel", "dep:uzor-urx-core", "dep:uzor-urx-cpu"]

[dependencies]
# Sim core -- always on, regardless of the `render` feature. `bincode` is a
# divergence from the plan's own "zero deps beyond thiserror+serde" summary
# line; see `src/replay.rs`'s own module doc for why a wire-format crate is
# structurally required and why `bincode` is the one the plan's own
# pseudocode already named (`bincode_decode`).
thiserror = "2"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
uzor-tui = { version = "1.5.1", features = ["ascii"], optional = true }
uzor-text = { version = "1.5.1", optional = true }
# Same sixel encoder `gate4agent-tui` already bakes its own icons with --
# see `backend_sixel.rs`'s own module doc for why this backend calls it
# directly instead of re-deriving sixel encoding.
icy_sixel = { version = "0.6", optional = true }
# URX -- uzor's own render backend (own scanline rasteriser, no GPU/window/
# event loop -- see `render/backend_pixel.rs`'s own module doc for why this
# replaced the hand-rolled `pixel.rs` primitives). Local path dependency into
# the `uzor` submodule, same convention `landing/crates/landing-wasm`'s own
# `Cargo.toml` already uses for the sibling `uzor` crate itself -- not a
# crates.io pin, since these specific URX crates were never independently
# confirmed to resolve there (see `docs/gate4agent/research/urx-pixel-path-
# for-terminal-2026-08-27.md` §9). `uzor-urx-cpu`'s default features (no
# `parallel`, no `glyph`, no `image-decode`) are exactly right here: this
# backend never draws text or raster images through URX, and rayon-per-band
# parallelism is an optimisation this pass's own bench numbers did not show
# a need for.
uzor-urx-core = { path = "../../uzor/uzor-urx-core", optional = true }
uzor-urx-cpu = { path = "../../uzor/uzor-urx-cpu", optional = true }
