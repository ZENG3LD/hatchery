[package]
name = "gate4agent-arcade-sweep"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless balance sweep. Never depends on a terminal."

[dependencies]
# `default-features = false` is a structural guard (see
# `games/pet-bastion/Cargo.toml`'s own identical comment): this sweep binary
# must never resolve uzor-tui/uzor-text/icy_sixel into its graph, by
# construction, regardless of what the engine's own default feature set
# becomes in the future.
gate4agent-arcade-engine = { path = "../engine", default-features = false }
gate4agent-arcade-pet-bastion = { path = "../games/pet-bastion", default-features = false }
