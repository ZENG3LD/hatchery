[workspace]

[package]
name = "hatchery-node"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Hatchery node: the complete node kit over the gate4agent transport (PTY/inline sessions, file browser, local git, worktrees, mailbox, browser station, session restore)"

[lib]
name = "hatchery_node"

[[bin]]
name = "gate4agent-node"
path = "src/main.rs"

[dependencies]
# Standard kit cores. Optional so `--no-default-features --features bare` leaves
# them out. dig2browser is a path dep: the published dig2browser
# 0.5.0 is not the node browser machine in this tree (stream machine lives
# here), and mail4agent is crates.io 0.4 (lib face). claude/codex session
# restore 0.1.3 are libraries on crates.io. grok/kimi 0.1.3 on crates.io are
# binary-only, so those two are path deps. Nothing here is published.
dig2browser = { path = "../../../dig2browser", version = "0.5.0", optional = true, default-features = false }
mail4agent = { version = "0.4", optional = true, default-features = false }
claude-session-restore = { version = "0.1.3", optional = true }
codex-session-restore = { version = "0.1.3", optional = true }
grok-session-restore = { path = "../../../session-restore/crates/grok-session-restore", version = "0.1.3", optional = true }
kimi-session-restore = { path = "../../../session-restore/crates/kimi-session-restore", version = "0.1.3", optional = true }
gate4agent-adapters = { version = "0.4.8" }
gate4agent-catalog = { version = "0.4.8" }
gate4agent-handle = { version = "0.4.8" }
gate4agent-node-core = { version = "0.4.8" }
gate4agent-node-protocol = { version = "0.4.8" }
gate4agent-node-wire = { version = "0.4.8" }
gate4agent-runtime-native = { version = "0.4.8" }
gate4agent-testkit = { optional = true, version = "0.4.8" }
gate4agent-types = { version = "0.4.8" }
ring = "=0.17.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# Full kit by default: there is no light mode.
default = ["kit"]
kit = ["m4a", "d2b", "session-restore", "wireguard", "memory"]
# Mailbox (mail4agent 0.4): started automatically by the node binary.
m4a = ["dep:mail4agent"]
# Local browser machine (dig2browser).
d2b = ["dep:dig2browser"]
# claude / codex / grok / kimi session restore.
session-restore = [
    "dep:claude-session-restore",
    "dep:codex-session-restore",
    "dep:grok-session-restore",
    "dep:kimi-session-restore",
]
# Kernel WireGuard for node<->C2. Either peer may dial. Not the UDP+ChaCha mesh
# underlay and not open_wireguard_daemon_stub. The driver may be replaced later;
# this build calls `ip link` / `wg`.
wireguard = ["gate4agent-node-core/wireguard"]
# Memory is exposed to agents only as a tool the agent chooses to call; the
# node never starts a memory daemon. Reserved: the tool registration lands with
# the memory4agent dependency; no code is gated on it yet.
memory = []
fixture = ["dep:gate4agent-testkit", "gate4agent-node-wire/fixture"]
# Cheap dig2browser-station named-pipe path reachability probe + node-local
# exclusive BrowserStationLease. The dig2browser crate dep itself is feature `d2b`.
# Feature off keeps browser_profile_id stub echo.
dig2-station-probe = []

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# C2 <-> node integration tests (tests/c2_*.rs): C2 and the node are equal peers.
hatchery-c2 = { path = "../hatchery-c2", version = "0.1.0" }
hatchery-c2-client = { path = "../hatchery-c2-client", version = "0.1.0" }
vt100 = "0.16"

# Local preparation only. Every gate4agent crate resolves to the sibling
# gate4agent checkout (branch migrate/node-core-extract: carries
# gate4agent-node-core and the HQ client). Do not publish with this table:
# at the publish step it is removed and the crates.io 0.5.x releases are used.
[patch.crates-io]
gate4agent-adapters = { path = "../../../gate4agent/crates/gate4agent-adapters" }
gate4agent-bidi-relay = { path = "../../../gate4agent/crates/gate4agent-bidi-relay" }
gate4agent-build-stamp = { path = "../../../gate4agent/crates/gate4agent-build-stamp" }
gate4agent-catalog = { path = "../../../gate4agent/crates/gate4agent-catalog" }
gate4agent-engine = { path = "../../../gate4agent/crates/gate4agent-engine" }
gate4agent-handle = { path = "../../../gate4agent/crates/gate4agent-handle" }
gate4agent-kernel = { path = "../../../gate4agent/crates/gate4agent-kernel" }
gate4agent-node-core = { path = "../../../gate4agent/crates/gate4agent-node-core" }
gate4agent-node-protocol = { path = "../../../gate4agent/crates/gate4agent-node-protocol" }
gate4agent-node-wire = { path = "../../../gate4agent/crates/gate4agent-node-wire" }
gate4agent-provider-ports = { path = "../../../gate4agent/crates/gate4agent-provider-ports" }
gate4agent-pty = { path = "../../../gate4agent/crates/gate4agent-pty" }
gate4agent-runtime-native = { path = "../../../gate4agent/crates/gate4agent-runtime-native" }
gate4agent-shell-capabilities = { path = "../../../gate4agent/crates/gate4agent-shell-capabilities" }
gate4agent-shell-history = { path = "../../../gate4agent/crates/gate4agent-shell-history" }
gate4agent-shell-native = { path = "../../../gate4agent/crates/gate4agent-shell-native" }
gate4agent-shell-one-shot = { path = "../../../gate4agent/crates/gate4agent-shell-one-shot" }
gate4agent-testkit = { path = "../../../gate4agent/crates/gate4agent-testkit" }
gate4agent-tool-engine = { path = "../../../gate4agent/crates/gate4agent-tool-engine" }
gate4agent-tool-protocol = { path = "../../../gate4agent/crates/gate4agent-tool-protocol" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
