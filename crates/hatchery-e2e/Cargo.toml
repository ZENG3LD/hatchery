[package]
name = "hatchery-e2e"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Cross-component end-to-end tests (node + edge + core + harness). Never published."

[lib]
name = "hatchery_e2e"

[features]
default = ["m4a"]
m4a = ["hatchery-server/m4a"]

[dependencies]
hatchery-core = { path = "../hatchery-core" }
hatchery-c2 = { path = "../hatchery-c2" }
hatchery-c2-client = { path = "../hatchery-c2-client" }
hatchery-c2-protocol = { path = "../hatchery-c2-protocol", features = ["nested-crypto"] }
hatchery-server = { path = "../hatchery-server" }
hatchery-node = { path = "../hatchery-node", features = ["fixture"] }
tokio = { version = "1", features = ["full"] }
gate4agent-node-protocol = { version = "0.5.2" }
gate4agent-node-wire = { version = "0.5.2" }

[dev-dependencies]
hatchery-enroll = { path = "../hatchery-enroll" }
hatchery-build = { path = "../hatchery-build" }
hatchery-harness-client = { path = "../hatchery-harness-client" }
hatchery-harness-engine = { path = "../hatchery-harness-engine" }
hatchery-harness-protocol = { path = "../hatchery-harness-protocol" }
hatchery-harness-service = { path = "../hatchery-harness-service" }
hatchery-harness-light = { path = "../hatchery-harness-light" }
hatchery-harness-mcp = { path = "../hatchery-harness-mcp" }
hatchery-observation-service = { path = "../hatchery-observation-service" }
gate4agent-testkit = { version = "0.5.2" }
gate4agent-types = { version = "0.5.2" }
async-trait = "0.1"
base64 = "0.22"
serde_json = "1"
tempfile = "3"
ring = "=0.17.14"
vt100 = "0.16"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
] }
