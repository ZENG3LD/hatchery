[package]
name = "hatchery-c2-protocol"
version = "0.2.37"
edition = "2021"
description = "Stable, serde-only inventory and control wire contract for gate4agent C2 relays and clients"
publish = false

[lib]
name = "hatchery_c2_protocol"

[dependencies]
hatchery-build-stamp = { path = "../hatchery-build-stamp" }
hatchery-node-protocol = { path = "../hatchery-node-protocol" }
gate4agent-types = { path = "../../../gate4agent/crates/gate4agent-types" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
