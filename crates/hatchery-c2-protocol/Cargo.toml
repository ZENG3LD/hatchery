[package]
name = "hatchery-c2-protocol"
version = "0.2.4"
edition = "2021"
repository = "https://github.com/ZENG3LD/hatchery"
description = "Stable, serde-only inventory and control wire contract for C2 relays and clients"
license = "MIT"

[lib]
name = "hatchery_c2_protocol"

[dependencies]
gate4agent-build-stamp = { version = "0.5.2" }
gate4agent-node-protocol = { version = "0.5.2" }
gate4agent-types = { version = "0.5.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
getrandom = { version = "0.2", optional = true }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"], optional = true }
chacha20poly1305 = { version = "0.10", optional = true }
snow = { version = "0.10", optional = true }

[features]
default = []
# Nested restreamer crypto (outer C2 layer + inner Noise_NK node<->HQ).
nested-crypto = ["dep:sha2", "dep:getrandom", "dep:x25519-dalek", "dep:chacha20poly1305", "dep:snow"]

[dev-dependencies]
serde_json = "1"
