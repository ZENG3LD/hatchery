[workspace]
resolver = "2"
members = [
    "crates/hatchery-harness-protocol",
    "crates/hatchery-harness-api",
    "crates/hatchery-harness-engine",
    "crates/hatchery-harness-delivery",
    "crates/hatchery-harness-service",
    "crates/hatchery-harness-light",
    "crates/hatchery-harness-client",
    "crates/hatchery-harness-mcp",
    "crates/hatchery-observation-protocol",
    "crates/hatchery-observation-api",
    "crates/hatchery-observation-engine",
    "crates/hatchery-observation-store",
    "crates/hatchery-observation-service",
    # Arcade (was nested workspace under crates/hatchery-arcade)
    "crates/hatchery-arcade/engine",
    "crates/hatchery-arcade/games/pet-bastion",
    "crates/hatchery-arcade/games/pet-bastion-render",
    "crates/hatchery-arcade/sweep",
    "crates/hatchery-arcade/preview",
    "crates/hatchery-arcade/bench",
    # TUI (was nested single-crate workspace)
    "crates/hatchery-tui",
    "crates/hatchery-bidi-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"

# Local preparation only: HQ WireGuard client dial lives in the gate4agent
# tree. Do not publish. Versions stay 0.4.8.
[patch.crates-io]
gate4agent-build-stamp = { path = "../gate4agent/crates/gate4agent-build-stamp" }
gate4agent-c2-client = { path = "../gate4agent/crates/gate4agent-c2-client" }
gate4agent-c2-protocol = { path = "../gate4agent/crates/gate4agent-c2-protocol" }
gate4agent-node-protocol = { path = "../gate4agent/crates/gate4agent-node-protocol" }
gate4agent-node-wire = { path = "../gate4agent/crates/gate4agent-node-wire" }
gate4agent-types = { path = "../gate4agent/crates/gate4agent-types" }
