[workspace]
resolver = "2"
members = [
    "crates/hatchery-harness-protocol",
    "crates/hatchery-harness-api",
    "crates/hatchery-harness-engine",
    "crates/hatchery-harness-delivery",
    "crates/hatchery-harness-service",
    "crates/hatchery-harness-light",
    "crates/hatchery-harness-client",
    "crates/hatchery-harness-mcp",
    "crates/hatchery-observation-protocol",
    "crates/hatchery-observation-api",
    "crates/hatchery-observation-engine",
    "crates/hatchery-observation-store",
    "crates/hatchery-observation-service",
]
# Nested workspaces: arcade (engine/games/sweep/preview/bench) and TUI.
# Arcade is hatchery-owned, not g4a. Check via `cargo check` inside each
# nest; root members stay harness + observation only.
exclude = [
    "crates/hatchery-tui",
    "crates/hatchery-arcade",
]
