# Local HQ line: the hq-edge terminal client (TUI) and the arcade. Built on the user's own
# machine; never deployed to a server. Talks to hq-core only over the hq-edge (hq-web) API and
# uses the published server-line crates from crates.io. The server workspace lives on `main`.
[workspace]
resolver = "2"
members = [
    "crates/hatchery-tui",
    "crates/hatchery-arcade/engine",
    "crates/hatchery-arcade/games/pet-bastion",
    "crates/hatchery-arcade/games/pet-bastion-render",
    "crates/hatchery-arcade/sweep",
    "crates/hatchery-arcade/preview",
    "crates/hatchery-arcade/bench",
]

[workspace.package]
version = "0.2.14"
edition = "2021"
license = "MIT"
repository = "https://github.com/ZENG3LD/hatchery"
