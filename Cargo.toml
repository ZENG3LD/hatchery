[package]
name = "hatchery"
version = "0.1.0"
edition = "2021"
description = "Swarm orchestration system — spawn, coordinate, and manage agent teams with shared memory"

[[bin]]
name = "hatchery"
path = "src/main.rs"

[dependencies]
# Hub core — PTY/Pipe process management, NDJSON parsing
zengeld-hub-core = { path = "../zengeld-hub/crates/core" }

# CLI
clap = { version = "4", features = ["derive"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Regex for PRD parsing
regex = "1"

# Efficient synchronization primitives
parking_lot = "0.12"

# Logging (for infestation_pit module)
tracing = "0.1"

# Cryptography (for content hashing in infestation_pit)
sha2 = "0.10"

# UUID generation for message IDs
uuid = { version = "1", features = ["v4"] }

# Async trait support for V2 Queen trait
async-trait = "0.1"

# AST parsing for code quality analysis
syn = { version = "2", features = ["full", "visit", "extra-traits"] }

# Directory paths (home dir for session recovery)
dirs = "5"

# Async runtime (needed for V2 Queen trait implementations)
tokio = { version = "1", features = ["full"] }

# Async utilities (for parallel assignment)
futures = "0.3"

# SQLite for event logging
rusqlite = { version = "0.31", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
